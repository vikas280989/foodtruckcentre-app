name: iOS – upload to TestFlight

# Manual only. Needs these GitHub Secrets (from the CLIENT's Apple Developer / App Store Connect account):
#   APPLE_TEAM_ID              10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID                 App Store Connect API key ID   (Users and Access > Integrations > App Store Connect API)
#   ASC_ISSUER_ID              Issuer ID shown on the same page
#   ASC_KEY_P8_BASE64          the downloaded AuthKey_XXXX.p8, base64-encoded (base64 -i AuthKey_XXXX.p8)
# Signing certificates and profiles are created and managed automatically by Xcode with that key
# – nothing secret is stored in the repository.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (must increase for every upload, e.g. 3)'
        required: true

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are configured
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=0
          for v in TEAM KID ISS P8; do [ -n "${!v}" ] || { echo "::error::Secret for $v is not set"; missing=1; }; done
          exit $missing

      - name: Write API key (temporary, removed at the end)
        env:
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Generate project
        run: brew install xcodegen && cd ios && xcodegen generate

      - name: Archive (Release, automatic signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive -project FoodTruckCentre.xcodeproj -scheme FoodTruckCentre -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FTC.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.event.inputs.build_number }}" | tail -n 20

      - name: Upload to App Store Connect (TestFlight)
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FTC.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          echo "Uploaded. The build appears in App Store Connect > TestFlight after Apple finishes processing (usually 10–30 minutes)."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
